<p class="mat-body-1">get-data-from-api-modular</p>

<!-- Fetch Users Button -->
<button mat-raised-button (click)="fetchUsers()" 
style="color: white; background-color: #3f51b5;">
  Fetch Users
</button>

<div class="container-box">
  <!-- Loading Spinner -->
  @if (isLoading()) {
    <div class="spinner-container">
      <mat-spinner diameter="40"></mat-spinner>
      <span>Loading...</span>
    </div>
  }

  <!-- No Users Found -->
  @if (!isLoading() && users().length === 0) {
    <mat-card class="info-card">
      <mat-card-content>No users found.</mat-card-content>
    </mat-card>
  }

  <!-- Users List -->
  @if (!isLoading() && users().length > 0) {
    <mat-selection-list class="user-list">
      @for (user of users(); track user.id) {
        <mat-list-item>
          <span matListItemTitle>{{ user.username }}</span>
          <span matListItemLine>{{ user.email }}</span>
          
          <!-- Delete Button (Icon Button) -->
          <button mat-icon-button color="warn" matListItemMeta (click)="deleteUser(user.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-list-item>
      }
    </mat-selection-list>
  }
</div>
