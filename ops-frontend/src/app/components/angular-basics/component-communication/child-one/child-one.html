<mat-card>

  <mat-card-header>
    <mat-card-title>Child One Component</mat-card-title>
  </mat-card-header>

  <mat-card-content>

    <h3>
      Value received from Parent:
    </h3>

    <p>
      {{ greeting }} | {{ msg }} | {{ third }}
    </p>

    <mat-divider></mat-divider>

    <h2 class="mt-3">Employee List</h2>

    <mat-list>
      <mat-list-item *ngFor="let employee of employeeArray">
        <strong>{{ employee.name }}</strong>
        &nbsp; - Age: {{ employee.age }}
      </mat-list-item>
    </mat-list>

  </mat-card-content>

</mat-card>
