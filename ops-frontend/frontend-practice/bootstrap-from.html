<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>

<div class="container">
  <h2>Vertical (basic) form</h2>
  <form method="post" action="/action_page.php">
    <div class="form-group">
      <label for="employeeemail">Email:</label>
      <input type="email" class="form-control" id="employeeemail" placeholder="Enter your @office email" 
      name="email" value="a@abc.com">
    </div>
    <div class="form-group">
      <label for="pwd">Password:</label>
      <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pwd">
    </div>
    <div class="checkbox">
      <label><input type="checkbox" name="remember"> Remember me</label>
    </div>
    <button type="submit" class="btn btn-default">Submit</button>
    <button type="submit" class="btn btn-primary">Submit</button>
    <button type="submit" class="btn btn-danger" disabled="false">Delete</button>
  </form>
</div>


<div>
    <form>
        <label>Username:</label>
        <input type="text" name="username" value="JohnDoe">

        
        <label>Password:</label>
        <input type="password" name="password" value="123456">
    </form>
</div>

<div class="alert alert-success " role="alert">
  <strong>Success!</strong> Your profile has been updated successfully.
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close">Close</button>
</div>

<div>
    <p class="text-success">Profile updated successfully!</p>
</div>

<div>
    <p class="text-danger">Save operation is failed</p>
</div>

</body>
</html>
