<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
  <script>
    function saveData(){
      //API request to save data
      document.getElementById("successMsg").innerHTML = "<b>Data saved successfully!</b>";
      document.getElementById("successMsg").style.display = "block";
      document.getElementById("successMsg").style.color = "green";

      document.getElementById("msgTwo").innerText = "<b>Data saved successfully!</b>";

      setTimeout(function(){
        document.getElementById("successMsg").innerText = "none";
        document.getElementById("successMsg").style.display = "none";
      }, 3000);
    }

    const saveDataInStorage = () => {
      const authObject = { id:1, name:"Tom", jwt:"eyyhxvshvhvxvhs.hxshxh.xhsghghg"}
      localStorage.setItem("Key1", "Value1");
      localStorage.setItem("Key2", JSON.stringify(authObject));

      sessionStorage.setItem('My Session key', "45454HGHG%#%#$#$ghghgh7878");
    }


    const logout = () => {
      localStorage.clear();
      sessionStorage.clear();
    }
    
  </script>
<body>

<div class="container">
  <h1>My First Bootstrap Page</h1>
  <p>This part is inside a .container class.</p>
  <p>The .container class provides a responsive fixed width container.</p>
  <div id="successMsg" style="display:none">Dummmmmmmy divvvvvv</div>
  <div id="msgTwo">Message: </div>
</div>

<div class="container">
    <button class="btn btn-success">Ok</button>
    <button class="btn btn-danger">Delete</button>
    <button class="btn btn-primary" onclick="saveData()"> Save</button>
    <button class="btn btn-warning" onclick="saveDataInStorage()">Add Data inside storage</button>
    <button class="btn btn-danger" onclick="logout()">LOGOUT</button>
</div>

</body>
</html>
