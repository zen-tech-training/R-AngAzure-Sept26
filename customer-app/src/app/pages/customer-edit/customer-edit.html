<div class="container mt-4">

<h2>Edit Customer</h2>

<h1>JOSN DATA : {{ customer() | json }}</h1>

<form (ngSubmit)="update()">

<input
class="form-control mb-2"
[(ngModel)]="customer().name"
name="name">

<input
class="form-control mb-2"
[(ngModel)]="customer().email"
name="email">

<input
class="form-control mb-2"
[(ngModel)]="customer().phone"
name="phone">

<button class="btn btn-primary">
Update
</button>

</form>

</div>
