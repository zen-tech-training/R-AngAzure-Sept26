<div class="container mt-4">

    <h2>Customer List</h2>

    <a
      routerLink="/add-customer"
      class="btn btn-primary mb-3">
      Add Customer
    </a>

    <table class="table table-bordered">

        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

            @for(item of customerService.customers(); track item.id){

            <tr>

                <td>{{item.id}}</td>
                <td>{{item.name}}</td>
                <td>{{item.email}}</td>
                <td>{{item.phone}}</td>

                <td>

                    <a
                    [routerLink]="['/edit-customer',item.id]"
                    class="btn btn-warning btn-sm me-2">
                    Edit
                    </a>

                    <button
                    class="btn btn-danger btn-sm"
                    (click)="deleteCustomer(item.id)">
                    Delete
                    </button>

                </td>

            </tr>

            }

        </tbody>

    </table>

</div>
